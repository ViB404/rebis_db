[package]
name = "rebis_db"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"                                   # error handling
bytes = "1.10.1"                                     # helps manage buffers
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"                                # error handling
tokio = { version = "1.44.2", features = ["full"] } # async networking
